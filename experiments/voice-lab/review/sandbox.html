<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>横川AI Voice Sandbox</title>
    <link rel="stylesheet" href="/review/styles.css" />
  </head>
  <body>
    <main class="shell sandbox-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">YOKOGAWA AI · VOICE SANDBOX</p>
          <h1>文字と声の調整を、その場で試す。</h1>
          <p class="intro">2Dを初期値にしたローカル実験です。入力文と生成音声は保存されません。</p>
        </div>
        <a class="round-tab sandbox-back" href="/pause-test"><span>← 比較へ戻る</span></a>
      </header>

      <form class="sandbox-panel" id="sandbox-form">
        <label class="sandbox-field sandbox-text">
          <span>読ませる文字列</span>
          <textarea id="sandbox-text" maxlength="500" rows="7">受付時に登録された情報を、館内のシステムと照合しています。このAIの基礎技術は、情報分析だけでなく、高度なセキュリティーにも応用されています。ライブラリーセンターに保管されている貴重書、『プリンキピア』の管理にも、同系統のシステムが使われています</textarea>
          <small><span id="character-count">0</span> / 500文字</small>
        </label>

        <div class="sandbox-controls">
          <label class="sandbox-field"><span>句点の直後</span><select id="punctuation-mode"><option value="none">変更なし</option><option value="one" selected>。…（暫定）</option><option value="two">。……</option></select></label>
          <label class="sandbox-field"><span>speed</span><input id="speed-scale" type="number" min="0.8" max="1.3" step="0.01" value="1.08" /></label>
          <label class="sandbox-field"><span>intonation</span><input id="intonation-scale" type="number" min="0" max="1" step="0.01" value="0.25" /></label>
          <label class="sandbox-field"><span>tempo dynamics</span><input id="tempo-scale" type="number" min="0" max="1" step="0.01" value="0.08" /></label>
          <label class="sandbox-field"><span>pause scale</span><input id="pause-scale" type="number" min="0.5" max="2" step="0.05" value="1.35" /></label>
        </div>

        <div class="sandbox-actions">
          <button class="play-button sandbox-generate" id="generate-button" type="submit">▶ 生成して再生</button>
          <button class="sequence-button" id="reset-button" type="button">2D初期値へ戻す</button>
          <span class="sandbox-status" id="sandbox-status" role="status">準備完了</span>
        </div>
      </form>

      <section class="sandbox-result" id="sandbox-result" hidden>
        <p class="section-label">SYNTHESIS TEXT</p>
        <p id="synthesis-preview"></p>
        <audio id="sandbox-audio" controls></audio>
      </section>
    </main>
    <script type="module" src="/review/sandbox.js"></script>
  </body>
</html>
