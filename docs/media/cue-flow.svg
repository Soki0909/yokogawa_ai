<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="305" viewBox="0 0 1010 305" role="img"><style>text{font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#e7f5fa}.label{font-size:20px;font-weight:600}.small{font-size:16px;fill:#aec9d5}.box{fill:#102b3a;stroke:#3d7389;stroke-width:1.5}.line{stroke:#64d8d0;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#64d8d0"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#071721"/><text x="40" y="42" class="label" text-anchor="start">Cue間は人が進行し、Cue内は時間に沿って演出を同期</text><rect class="box" x="35" y="95" width="190" height="95" rx="12"/><text x="130.0" y="142.5" class="label" text-anchor="middle">NEXT</text><text x="130.0" y="168.5" class="small" text-anchor="middle">舞台の合図で操作</text><rect class="box" x="285" y="95" width="190" height="95" rx="12"/><text x="380.0" y="142.5" class="label" text-anchor="middle">サーバー</text><text x="380.0" y="168.5" class="small" text-anchor="middle">Cue・開始時刻を更新</text><rect class="box" x="535" y="95" width="190" height="95" rx="12"/><text x="630.0" y="142.5" class="label" text-anchor="middle">Display</text><text x="630.0" y="168.5" class="small" text-anchor="middle">声・字幕・映像を再生</text><rect class="box" x="785" y="95" width="190" height="95" rx="12"/><text x="880.0" y="142.5" class="label" text-anchor="middle">舞台の進行を待つ</text><text x="880.0" y="168.5" class="small" text-anchor="middle">次の合図でNEXTへ</text><path class="line" d="M225,142 L285,142"/><path class="line" d="M475,142 L535,142"/><path class="line" d="M725,142 L785,142"/><path class="line" d="M630,190 V242 H380 V190"/><text x="500" y="272" class="small" text-anchor="middle">再生・演出の進行をサーバーへ通知</text></svg>