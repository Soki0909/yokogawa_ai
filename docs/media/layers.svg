<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="265" viewBox="0 0 1100 265" role="img"><style>text{font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#e7f5fa}.label{font-size:20px;font-weight:600}.small{font-size:16px;fill:#aec9d5}.box{fill:#102b3a;stroke:#3d7389;stroke-width:1.5}.line{stroke:#64d8d0;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#64d8d0"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#071721"/><text x="40" y="42" class="label" text-anchor="start">画面はレイヤーを重ねて構成</text><rect class="box" x="30" y="95" width="153" height="85" rx="12"/><text x="106.5" y="144.5" class="label" text-anchor="middle">背景・光</text><path class="line" d="M183,138 L203,138"/><rect class="box" x="203" y="95" width="153" height="85" rx="12"/><text x="279.5" y="144.5" class="label" text-anchor="middle">アバター</text><path class="line" d="M356,138 L376,138"/><rect class="box" x="376" y="95" width="153" height="85" rx="12"/><text x="452.5" y="144.5" class="label" text-anchor="middle">場面画像</text><path class="line" d="M529,138 L549,138"/><rect class="box" x="549" y="95" width="153" height="85" rx="12"/><text x="625.5" y="144.5" class="label" text-anchor="middle">字幕・状態</text><path class="line" d="M702,138 L722,138"/><rect class="box" x="722" y="95" width="153" height="85" rx="12"/><text x="798.5" y="144.5" class="label" text-anchor="middle">警告・ゲージ</text><path class="line" d="M875,138 L895,138"/><rect class="box" x="895" y="95" width="153" height="85" rx="12"/><text x="971.5" y="144.5" class="label" text-anchor="middle">暗転</text><text x="550" y="228" class="small" text-anchor="middle">背面 → 前面　　字幕とアバターを画面効果から分離し、暗転を最上位に表示</text></svg>